<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Magieschloss | Königreich der Sinne</title>
  <link rel="stylesheet" href="./css/style.css?v=v4_107_magiccastle_fix_20260604">
  <link rel="stylesheet" href="./css/v4.css?v=v4_107_magiccastle_fix_20260604">
  <script src="./js/app-v4.js?v=v4_107_magiccastle_fix_20260604" defer></script>
</head>
<body data-page="magiccastle">
  <main class="magic-castle-page" aria-label="Magieschloss">
    <img class="magic-castle-bg" src="./assets/images/magiccastle/magieschloss_background.png" alt="Magieschloss mit Brücke">
    <img id="magicCastleHero" class="magic-castle-hero" src="./assets/images/characters/held.webp" alt="Ritter auf der Brücke">
    <section id="magicCastleLocks" class="magic-castle-locks" aria-label="Schlösser am Magieschloss">
      <button class="magic-castle-lock magic-lock-ice" type="button" data-lock-id="fuehlen" aria-label="Eisschloss öffnen">
        <img src="./assets/images/magiccastle/eisschloss.png" alt="Eisschloss">
      </button>
      <button class="magic-castle-lock magic-lock-grass" type="button" data-lock-id="riechen" aria-label="Grasschloss öffnen">
        <img src="./assets/images/magiccastle/grasschloss.png" alt="Grasschloss">
      </button>
      <button class="magic-castle-lock magic-lock-lava" type="button" data-lock-id="schmecken" aria-label="Lavaschloss öffnen">
        <img src="./assets/images/magiccastle/lavaschloss.png" alt="Lavaschloss">
      </button>
      <button class="magic-castle-lock magic-lock-cloud" type="button" data-lock-id="sehen" aria-label="Wolkenschloss öffnen">
        <img src="./assets/images/magiccastle/wolkenschloss.png" alt="Wolkenschloss">
      </button>
      <button class="magic-castle-lock magic-lock-sand" type="button" data-lock-id="hoeren" aria-label="Wüstenschloss öffnen">
        <img src="./assets/images/magiccastle/wuestenschloss.png" alt="Wüstenschloss">
      </button>
    </section>
    <nav class="magic-castle-bottom-bar" aria-label="Magieschloss Navigation">
      <a class="magic-castle-back game-btn secondary" href="./index.html?board=1">Zurück</a>
      <div id="magicCastleKeyBar" class="magic-castle-key-bar" aria-label="Gesammelte Schlüssel"></div>
    </nav>
  </main>
</body>
</html>
