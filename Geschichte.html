<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Geschichte | Königreich der Sinne</title>
  <link rel="stylesheet" href="./css/style.css?v=v4_120_true_viewport_bars_20260605">
  <link rel="stylesheet" href="./css/v4.css?v=v4_120_true_viewport_bars_20260605">
  <script src="./js/app-v4.js?v=v4_120_true_viewport_bars_20260605" defer></script>
</head>
<body data-page="story">
  <main class="story-page" aria-label="Geschichte">
    <section class="story-shell">
      <article class="story-card" aria-live="polite">
        <div class="story-image-wrap">
          <img id="storyImage" class="story-image" src="./assets/images/story/story_bookcover.png" alt="Geschichte starten">
        </div>
        <div class="story-text-panel">
          <div class="story-progress">
            <span id="storyCounter">Start</span>
          </div>
          <p id="storyText"></p>
          <div id="storyHeroNameBox" class="story-name-box hidden">
            <label for="storyHeroNameInput">Name des tapferen Helden</label>
            <input id="storyHeroNameInput" name="storyHeroNameInput" autocomplete="off" maxlength="28" placeholder="z. B. Sir Max">
          </div>
          <div class="story-actions">
            <button id="storyPrevBtn" class="game-btn muted" type="button">Zurück</button>
            <button id="storyNextBtn" class="game-btn primary" type="button">Geschichte starten</button>
            <button id="storySkipBtn" class="game-btn muted" type="button">Geschichte überspringen</button>
            <a id="storyStartBtn" class="game-btn primary hidden" href="./index.html?board=1">Abenteuer beginnen</a>
          </div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
